apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-bot
  labels:
    app: report-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-bot
  template:
    metadata:
      labels:
        app: report-bot
    spec:
      containers:
        - name: report-bot
          image: report-bot-image:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
