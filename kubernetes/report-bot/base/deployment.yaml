apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-bot
  labels:
    app: report-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-bot
  template:
    metadata:
      labels:
        app: report-bot
    spec:
      containers:
        - name: report-bot
          image: report-bot-image:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SMTP_HOST
              value: "mail.bold.ne.jp"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_TLS_SERVER_NAME
              value: "extremeserv.net"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credential
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credential
                  key: password
            - name: SHEETS_SERVICE_ACCOUNT_FILE
              value: "/etc/report-bot/sheets/credentials.json"
          volumeMounts:
            - name: sheets-service-account
              mountPath: /etc/report-bot/sheets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: sheets-service-account
          secret:
            secretName: sheets-service-account
