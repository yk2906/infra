---
- name: Get latest cosign release tag
  ansible.builtin.uri:
    url: https://api.github.com/repos/sigstore/cosign/releases/latest
    return_content: true
  register: cosign_latest_release

- name: Set cosign version (without leading v)
  ansible.builtin.set_fact:
    cosign_version: "{{ cosign_latest_release.json.tag_name | regex_replace('^v', '') }}"

- name: Download cosign .deb package
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/v{{ cosign_version }}/cosign_{{ cosign_version }}_amd64.deb"
    dest: "/tmp/cosign_{{ cosign_version }}_amd64.deb"

- name: Install cosign .deb package
  ansible.builtin.apt:
    deb: "/tmp/cosign_{{ cosign_version }}_amd64.deb"

- name: Remove downloaded .deb package
  ansible.builtin.file:
    path: "/tmp/cosign_{{ cosign_version }}_amd64.deb"
    state: absent

- name: Verify cosign installation
  ansible.builtin.command: cosign version
  register: cosign_check
  changed_when: false

- name: Show cosign version
  ansible.builtin.debug:
    msg: "{{ cosign_check.stdout_lines }}"
