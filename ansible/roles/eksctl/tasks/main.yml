---
- name: Set architecture for eksctl tarball
  ansible.builtin.set_fact:
    eksctl_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Get latest eksctl release tag
  ansible.builtin.uri:
    url: https://api.github.com/repos/eksctl-io/eksctl/releases/latest
    return_content: true
  register: eksctl_latest_release

- name: Create temporary directory for download
  ansible.builtin.tempfile:
    state: directory
    suffix: eksctl_install
  register: eksctl_temp_dir

- name: Download eksctl tarball
  ansible.builtin.get_url:
    url: "https://github.com/eksctl-io/eksctl/releases/download/{{ eksctl_latest_release.json.tag_name }}/eksctl_Linux_{{ eksctl_arch }}.tar.gz"
    dest: "{{ eksctl_temp_dir.path }}/eksctl.tar.gz"

- name: Unarchive eksctl tarball
  ansible.builtin.unarchive:
    src: "{{ eksctl_temp_dir.path }}/eksctl.tar.gz"
    dest: "{{ eksctl_temp_dir.path }}"
    remote_src: true

- name: Install eksctl to binary path
  ansible.builtin.copy:
    src: "{{ eksctl_temp_dir.path }}/eksctl"
    dest: /usr/local/bin/eksctl
    mode: "0755"
    remote_src: true

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ eksctl_temp_dir.path }}"
    state: absent

- name: Verify eksctl installation
  ansible.builtin.command: eksctl version
  register: eksctl_check
  changed_when: false

- name: Show eksctl version
  ansible.builtin.debug:
    msg: "{{ eksctl_check.stdout }}"
