---
- name: Download yq binary
  ansible.builtin.get_url:
    url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_{{ system_arch }}"
    dest: "{{ yq_install_path }}"
    mode: "0755"

- name: Verify yq installation
  ansible.builtin.command: "{{ yq_install_path }} --version"
  register: yq_check
  changed_when: false

- name: Show yq version
  ansible.builtin.debug:
    msg: "{{ yq_check.stdout }}"
