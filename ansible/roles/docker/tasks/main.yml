- name: Install dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Read /etc/os-release for Ubuntu base codename (Debian系派生ディストロ対応)
  ansible.builtin.slurp:
    src: /etc/os-release
  register: docker_os_release_raw

- name: Determine Docker apt repository codename
  ansible.builtin.set_fact:
    docker_repo_codename: >-
      {{ (docker_os_release_raw.content | b64decode)
         | regex_search('^UBUNTU_CODENAME=(.+)$', '\1', multiline=True)
         | first | default(ansible_distribution_release) }}

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ docker_repo_codename }} stable"
    state: present
    filename: docker

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

