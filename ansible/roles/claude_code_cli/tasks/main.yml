---
- name: Install Claude Code via official native installer
  ansible.builtin.shell: |
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/claude"
    executable: /bin/bash

- name: Verify Claude Code CLI installation
  ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/claude --version"
  register: claude_code_check
  changed_when: false

- name: Show Claude Code CLI version
  ansible.builtin.debug:
    msg: "{{ claude_code_check.stdout }}"
